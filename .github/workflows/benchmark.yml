name: Benchmark
# Runs vetcode against public malware datasets and benign packages on a throwaway GitHub
# runner, so no malicious sample ever lands on a contributor's machine. Start it by hand:
# Actions → Benchmark → Run workflow. Results are attached to the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      npm:
        description: npm packages per class (malicious and benign)
        default: "1000"
      pypi:
        description: PyPI packages per class
        default: "300"
      seed:
        description: Sampling seed (same seed, same sample)
        default: "7"
      only:
        description: Datasets to run (npm,pypi,skills,skills-heldout,rust,actions)
        default: "npm,pypi,skills"
      explain:
        description: Also describe the malicious samples that were missed (true or false)
        default: "false"
      guard:
        description: Also record the guard's answer for each package, as if it were being installed unreported (true or false)
        default: "false"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download samples (files only, nothing is installed or run)
        if: inputs.only != 'rust' && inputs.only != 'actions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_N: ${{ inputs.npm }}
          PYPI_N: ${{ inputs.pypi }}
          SEED: ${{ inputs.seed }}
          ONLY: ${{ inputs.only }}
        run: node bench/fetch.mjs --cache "$RUNNER_TEMP/bench" --npm "$NPM_N" --pypi "$PYPI_N" --seed "$SEED" --only "$ONLY"
      - name: Scan and score
        if: inputs.only != 'rust' && inputs.only != 'actions'
        env:
          ONLY: ${{ inputs.only }}
          EXPLAIN: ${{ inputs.explain }}
          GUARD: ${{ inputs.guard }}
        run: node bench/run.mjs --cache "$RUNNER_TEMP/bench" --out bench-results --only "$ONLY" $([ "$EXPLAIN" = "true" ] && echo --explain) $([ "$GUARD" = "true" ] && echo --guard)
      - name: Summary
        if: inputs.only != 'rust' && inputs.only != 'actions'
        run: node bench/summary.mjs bench-results >> "$GITHUB_STEP_SUMMARY"
      # The 200 most downloaded crates and build-script look-alikes, the proc-macro1 and onering
      # stand-ins with their rewrites, and the malicious releases crates.io still serves, read
      # through --cargo-diff. Crates are downloaded as archives and read; nothing is built.
      - name: Rust build scripts and proc macros
        if: contains(inputs.only, 'rust')
        run: |
          mkdir -p bench-results/rust
          node bench/rust.mjs --out bench-results/rust --top 200 --real > bench-results/rust/summary.json
          { echo '### Rust'; echo '```json'; cat bench-results/rust/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # GitHub Action bumps: 60 clean bumps of popular actions, the tj-actions and reviewdog stand-ins,
      # and the malicious commits themselves if GitHub still serves them. Source is read, never run.
      - name: GitHub Action bumps
        if: contains(inputs.only, 'actions')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bench-results/actions
          node bench/actions.mjs --out bench-results/actions --real > bench-results/actions/summary.json
          { echo '### GitHub Action bumps'; echo '```json'; cat bench-results/actions/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vetcode-benchmark
          path: bench-results/
          retention-days: 30
