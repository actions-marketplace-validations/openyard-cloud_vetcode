name: Release
# Releases happen on their own: merge a change to main that raises the version in package.json
# (and the five other version fields) and this workflow tags it, runs the tests, publishes the
# GitHub release with vetcode-skill.zip and the Gemini CLI extension, puts the plugin on the `plugin` branch (the one the
# Claude plugin directory follows), attaches vetcode.mcpb and publishes it to the MCP Registry,
# and publishes the npm package with provenance.
# Pushes that keep the same version are skipped. Run it by hand from Actions to retry.
# npm uses trusted publishing (no token): on npmjs.com, @openyard/vetcode → Settings →
# Trusted publisher → GitHub Actions, repository openyard-cloud/vetcode, workflow release.yml.
# With "Allow npm publish" ticked there the version goes public at once; without it the version
# is staged and a maintainer approves it under account settings → Staged Packages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: New version?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p 'require("./package.json").version')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1 && npm view "$(node -p 'require("./package.json").name')@$v" version >/dev/null 2>&1; then
            echo "v$v is already released on GitHub and npm; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Every version field says the same
        if: steps.v.outputs.new == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          bad=0
          check() { if [ "$2" != "$V" ]; then echo "::error file=$1::version $2, package.json says $V"; bad=1; fi; }
          check .claude-plugin/plugin.json "$(node -p 'require("./.claude-plugin/plugin.json").version')"
          check .claude-plugin/marketplace.json "$(node -p 'require("./.claude-plugin/marketplace.json").plugins[0].version')"
          check skills/vetcode/SKILL.md "$(sed -n 's/^ *version: "\(.*\)"/\1/p' skills/vetcode/SKILL.md)"
          check skills/vetcode/scripts/lib/index.mjs "$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' skills/vetcode/scripts/lib/index.mjs)"
          exit $bad
      - if: steps.v.outputs.new == 'true'
        run: npm test
      - name: Scan this repository with itself
        if: steps.v.outputs.new == 'true'
        run: node skills/vetcode/scripts/vet.mjs . --no-tools --fail-on high
      - name: Build the skill zip
        if: steps.v.outputs.new == 'true'
        run: npm run zip
      - name: Tag and GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" vetcode-skill.zip --clobber
          else
            gh release create "v$V" vetcode-skill.zip --target "$GITHUB_SHA" --title "vetcode $V" --generate-notes
          fi
      # Gemini CLI installs an extension from the latest release, picking the asset named for its
      # platform; without one it would install the repository, whose hooks/hooks.json is Claude Code's.
      - name: Gemini CLI extension
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          sh .github/gemini/build.sh "$RUNNER_TEMP/gemini"
          gh release upload "v$V" "$RUNNER_TEMP/gemini/darwin.vetcode.tar.gz" "$RUNNER_TEMP/gemini/linux.vetcode.tar.gz" "$RUNNER_TEMP/gemini/win32.vetcode.zip" --clobber
      # The Claude plugin directory follows the `plugin` branch: only what the plugin installs
      # (manifest, skill, hooks and its own README), one commit whenever that changes.
      - name: Plugin branch
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/plugin/build.sh "$RUNNER_TEMP/plugin" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      # The MCP bundle goes on the release once: the MCP Registry keeps its hash, and clients
      # check it before they install, so a bundle is never replaced. The registry entry is
      # published with the workflow's own identity (no token); a refusal is a warning, as for npm.
      - name: MCP bundle and registry
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          work="$RUNNER_TEMP/mcp"
          if gh release view "v$V" --json assets -q '.assets[].name' | grep -qx vetcode.mcpb; then
            gh release download "v$V" -p vetcode.mcpb -D "$RUNNER_TEMP/released"
            node .github/mcp/bundle.mjs "$work" "$RUNNER_TEMP/released/vetcode.mcpb"
          else
            node .github/mcp/bundle.mjs "$work"
            gh release upload "v$V" "$work/vetcode.mcpb"
          fi
          cd "$work"
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/io.github.openyard-cloud%2Fvetcode/versions/$V"; then
            echo "The MCP Registry already has $V."
            exit 0
          fi
          curl -sSfL -o publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          set +e
          ./mcp-publisher login github-oidc && ./mcp-publisher publish
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "io.github.openyard-cloud/vetcode $V is in the MCP Registry."
          else
            echo "::warning title=MCP Registry refused::io.github.openyard-cloud/vetcode $V was not published (exit $code). The lines above say why. vetcode.mcpb is on the release; run Release again by hand to retry."
          fi
      - name: npm publish
        if: steps.v.outputs.new == 'true'
        run: |
          name="$(node -p 'require("./package.json").name')"
          v="$(node -p 'require("./package.json").version')"
          if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already on npm"; exit 0; fi
          npm install -g npm@latest
          # npm hides why trusted publishing failed unless asked: keep the lines that say it.
          why() { grep -E "npm (verbose oidc|error|warn)|E[0-9]{3}|E_[A-Z_]+" "$1" | grep -v "Unknown user config" | tail -n 25 || true; }
          set +e
          npm publish --provenance --access public --loglevel verbose > publish.log 2>&1
          code=$?
          why publish.log
          if [ $code -eq 0 ]; then echo "$name@$v is published on npm."; exit 0; fi
          # A trusted publisher may be allowed to stage only: the version then waits on npmjs.com
          # (account settings, Staged Packages) for a maintainer to approve it with 2FA.
          npm stage publish --provenance --access public --loglevel verbose > stage.log 2>&1
          staged=$?
          why stage.log
          set -e
          if [ $staged -eq 0 ]; then
            echo "::warning title=npm: waiting for approval::$name@$v is staged, not public yet. Approve it on npmjs.com: account settings, Staged Packages (needs 2FA)."
          else
            # A registry refusal shows as a warning, not a failed release: the tag and the GitHub
            # release above are done. Run this workflow again by hand once npm accepts the package.
            echo "::warning title=npm publish refused::$name@$v was neither published nor staged (publish exit $code, stage exit $staged). The lines above say why. The GitHub release is done; run Release again by hand once npm accepts the package."
          fi
